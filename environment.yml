# -----------------------------------------------------------------------------
# NS_Implem — core conda environment (CPU-only, no deep-learning stack)
#
# Usage:
#   conda env create -f environment.yml
#   conda activate ns-implem
#
# This installs everything needed for:
#   - all /methods/ modules and their self-tests
#   - experiments/00, 01, 02, 04
#   - data/prepare_*.py                (synthetic + downloaded neuro data)
#
# For the LLM layer-wise experiment (experiments/03_llm_layerwise.py) and the
# vision-model RDM generator (data/prepare_model_rdms.py), also apply the
# overlay:
#   conda env update -f environment-full.yml
# -----------------------------------------------------------------------------
name: ns-implem
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - pandas>=2.0
  - scikit-learn>=1.3
  - tqdm>=4.65
  # neuro data I/O
  - h5py>=3.9
  - nibabel>=5.1
  # notebooks (experiments can also run as plain scripts)
  - jupyter
  # pip-only packages
  - pip:
      - rsatoolbox>=0.1.5
